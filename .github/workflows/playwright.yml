name: Playwright Tests

on:
  workflow_dispatch:
    inputs:
      test_grep:
        description: 'Optional: filter within WTCTH-normal-shelf-workflow.spec.ts by tag (e.g., @regression) or test name/substring'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      # Always test against main for now, regardless of which ref
      # this workflow_dispatch run was triggered from.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        # No package-lock.json is committed in this repo, so `npm ci`
        # (which requires a lockfile) cannot be used here.
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install

      - name: Create .env file from Secret
        shell: pwsh
        run: |
          $envContent = @"
          ${{ secrets.ENV_FILE }}
          "@
          $envContent | Out-File -FilePath .env -Encoding utf8

      # Scoped to this single spec for now (matches the existing
      # `test:sit` npm script on main). --grep further narrows within
      # the file: default to @regression, or use test_grep to override.
      - name: Run Playwright tests
        env:
          ENV: SIT
        run: npx playwright test tests/wpd-planogram/ui/WTCTH-normal-shelf-workflow.spec.ts --grep "${{ github.event.inputs.test_grep != '' && github.event.inputs.test_grep || '@regression' }}"

      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: reports/playwright-report/
          retention-days: 30

      - name: Upload Single-page Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: custom-report
          path: reports/custom-report/index.html
          retention-days: 30
